name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: opc
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GH_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/opc/stock-connect-backend
            echo "Before: $(git rev-parse --short HEAD)"
            git pull --ff-only https://x-access-token:${GH_TOKEN}@github.com/Ollkom/stock-connect-backend.git main
            echo "After:  $(git rev-parse --short HEAD)"
            git log -1 --oneline
            pm2 restart all
