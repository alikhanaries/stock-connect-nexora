name: Deploy to Dev Server

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Lint
        run: yarn eslint src --max-warnings 0

      - name: Syntax check
        run: |
          node --check src/app.js
          node --check src/server.js

      - name: Dependency audit
        run: yarn npm audit --all --severity critical

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Deploy
        env:
          HOST: ${{ secrets.DEV_SERVER_HOST }}
          USER: ${{ secrets.DEV_SERVER_USER }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEV_SSH_PRIVATE_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          rsync -az --delete \
            --exclude '.git' --exclude node_modules --exclude '.env*' \
            --exclude uploads --exclude src/log --exclude ecosystem.config.cjs \
            -e "ssh -i ~/.ssh/key" \
            ./ "$USER@$HOST:/home/ubuntu/stock-connect-backend/"

          ssh -i ~/.ssh/key "$USER@$HOST" 'set -e
            cd ~/stock-connect-backend
            HUSKY=0 yarn install --immutable
            pm2 reload stockconnect-backend --update-env
            curl -sf --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3000/'
