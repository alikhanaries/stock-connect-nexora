name: MongoDB Daily Backup

on:
  schedule:
    - cron: '0 2 * * *' # 2 AM UTC daily
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install MongoDB tools and B2 CLI
        run: |
          wget -qO- https://www.mongodb.org/static/pgp/server-7.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-7.0.gpg
          echo "deb [signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-database-tools
          pip install b2

      - name: Whitelist runner IP in Atlas
        env:
          ATLAS_PUBLIC_KEY: ${{ secrets.ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.ATLAS_PRIVATE_KEY }}
          ATLAS_PROJECT_ID: ${{ secrets.ATLAS_PROJECT_ID }}
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          curl --silent --show-error \
            --user "$ATLAS_PUBLIC_KEY:$ATLAS_PRIVATE_KEY" --digest \
            --header "Content-Type: application/json" \
            --header "Accept: application/vnd.atlas.2023-01-01+json" \
            --request POST \
            "https://cloud.mongodb.com/api/atlas/v2/groups/$ATLAS_PROJECT_ID/accessList" \
            --data "[{\"ipAddress\": \"$RUNNER_IP\", \"comment\": \"GitHub Actions runner - temporary\"}]"
          sleep 15

      - name: Dump MongoDB
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          DATE=$(date +%Y-%m-%d)
          mongodump --uri="$MONGO_URI" --gzip --archive=backup-$DATE.gz
          ls -lh backup-$DATE.gz
          echo "DATE=$DATE" >> $GITHUB_ENV

      - name: Encrypt backup
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
              --symmetric --cipher-algo AES256 \
              backup-${DATE}.gz
          ls -lh backup-${DATE}.gz.gpg

      - name: Upload to Backblaze B2
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          b2 file upload "$B2_BUCKET" "backup-${DATE}.gz.gpg" "daily/backup-${DATE}.gz.gpg"

      - name: Remove runner IP from Atlas whitelist
        if: always()
        env:
          ATLAS_PUBLIC_KEY: ${{ secrets.ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.ATLAS_PRIVATE_KEY }}
          ATLAS_PROJECT_ID: ${{ secrets.ATLAS_PROJECT_ID }}
        run: |
          curl --silent --show-error \
            --user "$ATLAS_PUBLIC_KEY:$ATLAS_PRIVATE_KEY" --digest \
            --header "Accept: application/vnd.atlas.2023-01-01+json" \
            --request DELETE \
            "https://cloud.mongodb.com/api/atlas/v2/groups/$ATLAS_PROJECT_ID/accessList/$RUNNER_IP"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Backup failed - consider wiring this to Slack/email"
          exit 1
